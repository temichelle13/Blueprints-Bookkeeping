  - esbuild@0.28.1
  # Renovate security update: multer@2.2.0
  - multer@2.2.0
  # Renovate security update: vite@8.0.16
  - vite@8.0.16
  # Renovate security update: sharp@0.35.0
  - sharp@0.35.0

allowBuilds:
  esbuild: true
